<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#1a2f47"/>
  <g transform="translate(256 256)">
    <circle r="170" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.85"/>

    <!-- Intercardinal short spikes -->
    <polygon points="70,-70 0,0 26,0" fill="#997703"/>
    <polygon points="70,-70 0,0 0,-26" fill="#EFBF04"/>
    <polygon points="-70,-70 0,0 0,-26" fill="#997703"/>
    <polygon points="-70,-70 0,0 -26,0" fill="#EFBF04"/>
    <polygon points="70,70 0,0 0,26" fill="#997703"/>
    <polygon points="70,70 0,0 26,0" fill="#EFBF04"/>
    <polygon points="-70,70 0,0 -26,0" fill="#997703"/>
    <polygon points="-70,70 0,0 0,26" fill="#EFBF04"/>

    <!-- Cardinal long points -->
    <polygon points="0,-150 -26,0 0,0" fill="#EFBF04"/>
    <polygon points="0,-150 26,0 0,0" fill="#997703"/>
    <polygon points="150,0 0,-26 0,0" fill="#EFBF04"/>
    <polygon points="150,0 0,26 0,0" fill="#997703"/>
    <polygon points="0,150 26,0 0,0" fill="#EFBF04"/>
    <polygon points="0,150 -26,0 0,0" fill="#997703"/>
    <polygon points="-150,0 0,26 0,0" fill="#EFBF04"/>
    <polygon points="-150,0 0,-26 0,0" fill="#997703"/>

    <circle r="17" fill="#ffffff"/>
    <circle r="6" fill="#1a2f47"/>
  </g>
  <text x="256" y="468" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="40" fill="#ffffff" letter-spacing="-1">WERKKOMPAS</text>
</svg>
